<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Capacitación · OnboardFlow</title>
<link rel="stylesheet" href="styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>.vlist .video-item{cursor:default}video{width:100%;max-height:70vh;background:#000;border-radius:12px}progress{width:100%}</style></head>
<body><header><a class="brand" href="#"><span class="mark">L</span><span>LillyTech<small>CAPACITACIÓN</small></span></a></header>
<main id="app"><p>Cargando…</p></main><div id="notice" role="status" aria-live="polite"></div>
<footer>LillyTech · SBM Costa Rica</footer>
<script>
'use strict';
const app=document.querySelector('#app');
const token=new URLSearchParams(location.search).get('t')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb,course,me,prog={},timer=null,busy=false;
const KEY='of3c-'+token;
function notify(m,err){const n=document.querySelector('#notice');n.textContent=m;n.className=err?'error':'';n.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>n.style.display='none',7000)}
async function rpc(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
function isDone(p){return prog[p]?.completed}
function nextPos(){return course.videos.find(v=>!isDone(v.position))?.position}
function loginView(){
  const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}})();
  app.innerHTML=`<section class="login"><div class="eyebrow">Capacitación</div><h1>${esc(course.title)}</h1><p class="muted">Vas a ver ${course.videos.length} videos en orden. Al terminar, podés hacer la evaluación.</p><form class="card" id="start"><label>Nombre completo<input name="name" required minlength="3" value="${esc(saved.name||'')}"></label><label>Cédula<input name="doc" required minlength="5" value="${esc(saved.doc||'')}"></label><button>Comenzar</button></form></section>`;
}
function listView(){
  stop();
  const done=course.videos.filter(v=>isDone(v.position)).length,np=nextPos();
  app.innerHTML=`<div class="eyebrow">${esc(course.title)}</div><h1>Hola, ${esc(me.full_name.split(' ')[0])}.</h1><p class="muted">${done} de ${course.videos.length} videos completados.</p>
  ${np===undefined?`<div class="banner"><strong>¡Terminaste todos los videos!</strong><br>${course.form_url?`<a href="${esc(course.form_url)}" target="_blank" rel="noopener noreferrer"><button type="button">Hacer la evaluación</button></a>`:'Consultá con RH para la evaluación.'}</div>`:''}
  <section class="card vlist">${course.videos.map(v=>`<div class="video-item"><span class="number">${isDone(v.position)?'✓':v.position}</span><div><h3>${esc(v.title)}</h3><small>${isDone(v.position)?'Completado':v.position===np?'Siguiente':'Bloqueado'}</small></div>${v.position===np?`<button data-play="${v.position}">${prog[v.position]?.watched_seconds>0?'Continuar':'Ver'}</button>`:''}</div>`).join('')}</section>
  ${np===undefined&&course.form_url?'':''}`;
}
function stop(){clearInterval(timer);timer=null}
async function play(pos){
  const v=course.videos.find(x=>x.position===pos);
  const info=await rpc('of3c_video_path',{p_token:token,p_doc:me.document_id,p_pos:pos});
  const {data:signed,error}=await sb.storage.from('of3-videos').createSignedUrl(info.path,14400);if(error)throw error;
  app.innerHTML=`<button type="button" data-back class="secondary">← Volver a la lista</button><div class="eyebrow" style="margin-top:24px">Video ${pos} de ${course.videos.length}</div><h1>${esc(v.title)}</h1><p class="muted">Mantené esta pantalla abierta. El avance se guarda mientras reproducís.</p><video id="player" controls playsinline controlslist="nodownload noplaybackrate" src="${esc(signed.signedUrl)}"></video><progress id="pg" max="${info.duration_seconds}" value="${info.watched_seconds||0}"></progress><p id="st" role="status">Listo para reproducir.</p>`;
  const el=app.querySelector('video'),pg=app.querySelector('#pg');
  el.addEventListener('loadedmetadata',()=>{el.currentTime=Math.min(info.watched_seconds||0,Math.max(0,el.duration-1))},{once:true});
  el.addEventListener('seeking',()=>{if(el.currentTime>Number(pg.value)+2)el.currentTime=Number(pg.value)});
  async function tick(){if(busy||document.hidden||(el.paused&&!el.ended))return;busy=true;try{const r=await rpc('of3c_tick',{p_token:token,p_doc:me.document_id,p_pos:pos,p_seconds:el.currentTime});pg.value=r.watched_seconds;prog[pos]={watched_seconds:r.watched_seconds,completed:r.completed};app.querySelector('#st').textContent=r.completed?'Video completado.':`${Math.floor(r.watched_seconds)} de ${Math.ceil(info.duration_seconds)} segundos verificados`;if(r.completed){stop();notify('Video completado.');setTimeout(listView,1200)}}catch(e){notify('No se guardó el avance: '+e.message,true)}finally{busy=false}}
  el.addEventListener('play',tick);el.addEventListener('ended',tick);
  el.addEventListener('error',()=>notify('No se pudo reproducir el video. Avisá a RH.',true));
  timer=setInterval(tick,5000);
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='start')return;e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
  try{const f=Object.fromEntries(new FormData(e.target));me=await rpc('of3c_start',{p_token:token,p_name:f.name,p_doc:f.doc});
    localStorage.setItem(KEY,JSON.stringify({name:f.name,doc:f.doc}));
    prog={};for(const p of me.progress)prog[p.position]={watched_seconds:p.watched_seconds,completed:p.completed};listView()}
  catch(err){notify(err.message,true);b.disabled=false}
});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  try{if(b.dataset.play){b.disabled=true;await play(Number(b.dataset.play))}else if('back' in b.dataset){listView()}}catch(err){notify(err.message,true);b.disabled=false}});
window.addEventListener('beforeunload',stop);
window.addEventListener('load',async()=>{
  try{if(!token)throw Error('Falta el código del enlace.');
    sb=window.supabase.createClient('https://yqmikjzwdyssmfqganbf.supabase.co','sb_publishable_FyeGXa_Zr32ZA3xIJGZkww_Ly91Tm2f',{auth:{persistSession:false,autoRefreshToken:false}});
    course=await rpc('of3c_course',{p_token:token});
    if(!course.videos.length)throw Error('Los videos todavía no están disponibles.');
    loginView()}
  catch(e){app.innerHTML=`<section class="card"><h1>Enlace no disponible</h1><p class="muted">${esc(e.message)}</p></section>`}
});
</script></body></html>
